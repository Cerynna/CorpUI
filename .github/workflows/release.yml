# Release de CorpUI : a chaque tag vX.Y.Z pousse sur GitHub, construit
# CorpUI-X.Y.Z.zip (le noyau CorpUI et les addons CorpUI_Xxx, cote a cote,
# prets a poser dans AddOns) et cree la release avec ses notes.
# Lancer une version : .github/scripts/release.sh X.Y.Z
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version de tous les .toc identique au tag
        id: ver
        run: |
          VER="${GITHUB_REF_NAME#v}"
          for toc in CorpUI/CorpUI.toc CorpUI_*/CorpUI_*.toc; do
            TOC=$(grep -m1 '^## Version:' "$toc" | sed 's/^## Version:[[:space:]]*//' | tr -d '\r')
            if [ "$TOC" != "$VER" ]; then
              echo "::error::$toc annonce la version $TOC, le tag est $GITHUB_REF_NAME"
              exit 1
            fi
          done
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Archive CorpUI-X.Y.Z.zip
        run: |
          # tous les dossiers d addons, cote a cote (CorpUI, CorpUI_Cadres...)
          ADDONS=$(git ls-tree -d --name-only "$GITHUB_REF_NAME" | grep -E '^CorpUI(_[A-Za-z]+)?$')
          git archive --format=zip -o "CorpUI-${{ steps.ver.outputs.ver }}.zip" "$GITHUB_REF_NAME" $ADDONS

      - name: Notes de version
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          cat > notes.md <<'EOF'
          ## Installation

          1. Télécharge **CorpUI-@VER@.zip** ci-dessous (pas « Source code »).
          2. Décompresse-le dans `World of Warcraft\_classic_beta_\Interface\AddOns\` : tu obtiens le dossier `CorpUI` (le noyau) et un dossier `CorpUI_Xxx` par module.
          3. Pour une mise à jour, supprime d'abord les anciens dossiers `CorpUI` et `CorpUI_Xxx` (tes réglages sont gardés : ils sont dans `WTF`), décompresse, puis relance le jeu.

          ## Changements

          EOF
          sed -i "s/@VER@/$VER/g; s/^          //" notes.md
          # notes redigees (accents, phrases) : .github/notes/vX.Y.Z.md si present,
          # sinon la liste des commits depuis la version precedente
          if [ -f ".github/notes/$GITHUB_REF_NAME.md" ]; then
            sed -i '/^## Changements$/,$d' notes.md
            cat ".github/notes/$GITHUB_REF_NAME.md" >> notes.md
          elif [ -n "$PREV" ]; then
            git log --no-merges --pretty='- %s' "$PREV..$GITHUB_REF_NAME" | grep -v -E '^- Version [0-9]' >> notes.md || true
          else
            echo "- Première version publiée." >> notes.md
          fi

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "CorpUI-${{ steps.ver.outputs.ver }}.zip" \
            --title "CorpUI ${{ steps.ver.outputs.ver }}" --notes-file notes.md
